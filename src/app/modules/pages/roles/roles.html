<app-role-form-component></app-role-form-component>
<app-assign-form-component></app-assign-form-component>
@if(loading) {
<app-spinner-component></app-spinner-component>
}@else {
<section class="w-full h-full p-mini flex flex-col gap-3 bg-(--card) rounded-lg shadow-md">
  <div class="w-full h-(--topbar-heights) flex justify-between items-center gap-3 border-b border-(--slate-200) p-mini">
      <h2 class="text-(--neutral-text) font-bold text-lg flex-1">Gestión de Roles</h2>
      <div class="flex relative">
        <i class="pi pi-search absolute top-1/2 -translate-y-1/2 right-0 p-10 text-(--slate-400)"></i>
        <input type="text" id="filter" name="filter" placeholder="Buscar usuario..." class="w-[200px] border text-(--slate-400) border-(--slate-300) rounded-md transition duration-300 ease-in-out hover:outline-none hover:ring-2 hover:ring-(--secondary) focus:outline-none focus:ring-2 focus:ring-(--primary) focus:text-(--neutral-text)" [(ngModel)]="filterValue"  (input)="onGlobalFilter()"/>
      </div>
      <button type="button" class="w-fit bg-(--primary) text-white rounded hover:bg-(--secondary) transition duration-300 ease-in-out flex items-center gap-3" (click)="addNewRole(null, false)">
        <i class="pi pi-plus"></i>
        <span>Nuevo</span>
      </button>
    </div>
  <div class="w-full h-full grid grid-cols-1 md:grid-cols-4 gap-2 overflow-auto scrollbar-class">
    @for (role of roles; track role.roleuuid) {
    <div class="w-full h-38 max-h-50 bg-(--card) border border-(--slate-200) rounded-lg shadow-lg p-10">
      <div class="w-full h-full flex flex-col gap-3">
        <h3 class="text-(--neutral-text) border-b border-(--neutral-text)">{{role.rolename}}</h3>
        <p class="text-(--neutral-text) h-full"> {{ role.roledesc }} </p>
        <div class="w-full flex justify-end gap-2">
          <div class="relative group">
            <button class="text-(--danger) border border-(--danger) rounded p-section flex justify-center items-center hover:bg-(--danger) hover:text-(--card-bg) transition duration-300 ease-in-out" (click)="onChangeStatus(role)">
              <i class="pi" [ngClass]="!role.isActive ? 'pi-verified' : 'pi-ban'"></i>
            </button>
            <div class="z-3000 absolute left-full top-[103%] -translate-x-[87%] whitespace-nowrap bg-(--background) text-(--neutral-text) mx-2 text-sm p-mini rounded opacity-0 group-hover:opacity-100 transition-opacity duration-300 shadow-lg">
              {{ role.isActive ? 'Inactivar' : 'Activar'}}
            </div>
          </div>
          <div class="relative group">
            <button class="text-(--success) border border-(--success) rounded p-section flex justify-center items-center hover:bg-(--success) hover:text-(--card-bg) transition duration-300 ease-in-out" (click)="addNewRole(role, true)">
              <i class="pi pi-pencil"></i>
            </button>
            <div class="z-3000 absolute left-full top-[103%] -translate-x-[98%] whitespace-nowrap bg-(--background) text-(--neutral-text) mx-2 text-sm p-mini rounded opacity-0 group-hover:opacity-100 transition-opacity duration-300 shadow-lg">
              Editar
            </div>
          </div>
          <div class="relative group">
            <button class="text-(--danger) border border-(--danger) rounded p-section flex justify-center items-center hover:bg-(--danger) hover:text-(--card-bg) transition duration-300 ease-in-out" (click)="onRemoveRole(role)">
              <i class="pi pi-trash"></i>
            </button>
            <div class="z-3000 absolute left-full top-[103%] -translate-x-[90%] ml-2 whitespace-nowrap bg-(--background) text-(--neutral-text) mx-2 text-sm p-mini rounded opacity-0 group-hover:opacity-100 transition-opacity duration-300 shadow-lg">
              Eliminar
            </div>
          </div>
          <div class="relative group">
            <button class="text-(--secondary) border border-(--secondary) rounded p-section flex justify-center items-center hover:bg-(--secondary) hover:text-(--card-bg) transition duration-300 ease-in-ou" (click)="assignPermissionsToRole(role.roleuuid)">
              <i class="pi pi-book"></i>
            </button>
            <div class="z-3000 absolute left-full top-[103%] -translate-x-[70%] ml-2 whitespace-nowrap bg-(--background) text-(--neutral-text) mx-2 text-sm p-mini rounded opacity-0 group-hover:opacity-100 transition-opacity duration-300 shadow-lg">
              Asignar permisos
            </div>
          </div>
        </div>
      </div>
    </div>
    }
  </div>
</section>
}
