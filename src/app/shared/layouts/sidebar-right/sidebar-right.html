<div class="h-full bg-(--card-bg) rounded-lg w-13 flex flex-col justify-center items-center gap-2">
  <a routerLink="/pages/main" routerLinkActive="active" class="flex justify-center items-center text-(--primary) text-lg hover:bg-(--neutral-bor) hover:text-(--neutral-text) transition duration-300 ease-in-out p-10 rounded">
    <i class="pi pi-home text-sm"></i>
  </a>
  <a routerLink="/pages/profile" routerLinkActive="active" class="flex justify-center items-center text-(--primary) text-lg hover:bg-(--neutral-bor) hover:text-(--neutral-text) transition duration-300 ease-in-out p-10 rounded">
    <i class="pi pi-user text-sm"></i>
  </a>
  <button type="button" class="flex justify-center items-center text-(--primary) text-lg hover:bg-(--neutral-bor) hover:text-(--neutral-text) transition duration-300 ease-in-out p-10 rounded" (click)="toggleTheme()">
    @if(theme === 'dark') {
      <i class="pi pi-sun text-sm"></i>
    }@else {
      <i class="pi pi-moon text-sm"></i>
    }
  </button>
  <button type="button" class="flex justify-center items-center text-(--primary) text-lg hover:bg-(--neutral-bor) hover:text-(--neutral-text) transition duration-300 ease-in-out p-10 rounded" (click)="onLogout()">
    <i class="pi pi-power-off text-sm"></i>
  </button>
</div>
