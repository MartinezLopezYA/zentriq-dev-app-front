<div class="h-full bg-[var(--card-bg)] rounded-lg w-13 flex flex-col justify-center items-center gap-2">
  <a routerLink="/pages/main" routerLinkActive="active" class="flex justify-center items-center text-[var(--primary)] border border-[var(--background)] text-lg hover:bg-[var(--background)] hover:text-[var(--neutral-text)] transition duration-300 ease-in-out p-10 rounded-full">
    <i class="pi pi-home text-sm"></i>
  </a>
  <a routerLink="/pages/profile" routerLinkActive="active" class="flex justify-center items-center text-[var(--primary)] border border-[var(--background)] text-lg hover:bg-[var(--background)] hover:text-[var(--neutral-text)] transition duration-300 ease-in-out p-10 rounded-full">
    <i class="pi pi-user text-sm"></i>
  </a>
  <button type="button" class="flex justify-center items-center border border-[var(--background)] text-lg hover:bg-[var(--background)] hover:text-[var(--neutral-text)] hover:scale-3d transition duration-300 ease-in-out p-10 rounded-full"(click)="toggleTheme()">
    @if(theme === 'dark') {
      <i class="pi pi-sun text-sm text-[var(--primary)]"></i>
    }@else {
      <i class="pi pi-moon text-sm text-[var(--primary)]"></i>
    }
  </button>
  <button type="button" class="flex justify-center items-center border border-[var(--background)] text-lg hover:bg-[var(--background)] hover:text-[var(--neutral-text)] hover:scale-3d transition duration-300 ease-in-out p-10 rounded-full" (click)="onLogout()">
    <i class="pi pi-power-off text-sm text-[var(--primary)]"></i>
  </button>
</div>
