@if(isOpen) {
  <div class="fixed inset-0 z-1500 flex items-center justify-end bg-(--background)/40 overflow-hidden">
    <div class="relative w-2/5 max-h-[90vh] bg-(--card) rounded-lg shadow-2xl p-20 transform transition-transform duration-500 ease-in-out" [class.translate-x-0]="entered" [class.translate-x-full]="!entered || closing">
      <div class="flex justify-between items-center border-b border-(--primary) p-6 sticky top-0 bg-(--card) z-10">
        <h2 class="text-(--neutral-text) text-lg font-semibold">{{ isEditRole ? 'Actualización' : 'Creación'}} de Rol</h2>
        <span class="text-(--neutral-text) cursor-pointer hover:text-(--primary) transition duration-300 ease-in-out" (click)="onCancel()">
          <i class="pi pi-times"></i>
        </span>
      </div>
      <div class="max-h-[calc(90vh-80px)] overflow-y-auto p-main-section scrollbar-class">
        <form class="w-full flex flex-col gap-8 justify-center " [formGroup]="roleForm" (ngSubmit)="submitRole()">
          <div class="w-full grid grid-cols-1 gap-4">
            <div class="flex flex-col gap-1">
              <label for="rolename" class="text-(--neutral-text) font-bold text-sm">Nombre <span class="text-(--danger)"> * </span> </label>
              <input type="text" id="rolename" name="rolename" formControlName="rolename" placeholder="e.g. Recursos humanos" class="border text-(--slate-400) border-(--slate-300) rounded-md transition duration-300 ease-in-out hover:outline-none hover:ring-2 hover:ring-(--secondary) focus:outline-none focus:ring-2 focus:ring-(--primary) focus:text-(--neutral-text)" required="true" maxlength="50" />
            </div>
            <div class="flex flex-col gap-1">
              <label for="roledesc" class="text-(--neutral-text) font-bold text-sm">Descripción <span class="text-(--danger)"> * </span> </label>
              <input type="text" id="roledesc" name="roledesc" formControlName="roledesc" placeholder="e.g. Gestión y salud humana" class="border text-(--slate-400) border-(--slate-300) rounded-md transition duration-300 ease-in-out hover:outline-none hover:ring-2 hover:ring-(--secondary) focus:outline-none focus:ring-2 focus:ring-(--primary) focus:text-(--neutral-text)" required="true" maxlength="50" />
            </div>
            <div class="flex flex-col gap-1">
              <label for="rolecode" class="text-(--neutral-text) font-bold text-sm">Código <span class="text-(--danger)"> * </span> </label>
              <input type="text" id="rolecode" name="rolecode" formControlName="rolecode" placeholder="e.g. RRHH" class="border text-(--slate-400) border-(--slate-300) rounded-md transition duration-300 ease-in-out hover:outline-none hover:ring-2 hover:ring-(--secondary) focus:outline-none focus:ring-2 focus:ring-(--primary) focus:text-(--neutral-text)" required="true" maxlength="50" />
            </div>
          </div>
          <div class="w-full flex justify-end gap-4 mt-4">
            <button type="button" class="btn secondary" (click)="onCancel()">Cancelar</button>
            <button type="submit" class="btn primary" [disabled]="roleForm.invalid || loading">{{ isEditRole ? 'Actualizar' : 'Crear'}} Rol</button>
          </div>
        </form>
      </div>
    </div>
  </div>
}
